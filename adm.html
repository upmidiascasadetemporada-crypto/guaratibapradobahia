<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | Guaratiba Prado Bahia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <section id="adm-login" class="min-h-screen flex items-center justify-center px-6">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
            <h1 class="text-2xl font-bold mb-2 text-center">Área Administrativa</h1>
            <p class="text-sm text-gray-500 text-center mb-6">Guaratiba Prado Bahia</p>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">E-mail</label>
                    <input type="email" id="admEmail" class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500" placeholder="seuemail@exemplo.com">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Senha</label>
                    <input type="password" id="admPass" class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500" placeholder="Sua senha">
                </div>
                <button onclick="handleLogin()" class="w-full bg-gray-900 text-white py-3 rounded-lg font-bold hover:bg-gray-800 transition">
                    Entrar
                </button>
            </div>
        </div>
    </section>

    <section id="adm-dashboard" class="hidden container mx-auto py-10 px-6">
        <div class="flex flex-col md:flex-row md:justify-between md:items-center gap-4 mb-8">
            <div>
                <h2 class="text-3xl font-bold">Painel de Controle</h2>
                <p class="text-gray-500">Gerencie categorias e anúncios</p>
            </div>
            <button onclick="logout()" class="text-red-500 font-bold self-start md:self-auto">Sair</button>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-md mb-10 border border-blue-100">
            <h3 class="text-xl font-bold mb-4 text-blue-600">Cadastrar / Editar Categoria</h3>
            <form id="categoryForm" class="grid md:grid-cols-2 gap-4">
                <input type="hidden" id="categoryEditIndex" value="-1">
                <input type="text" id="categorySlug" placeholder="Slug (ex: pousadas)" class="p-3 border rounded-lg" required>
                <input type="text" id="categoryName" placeholder="Nome (ex: Pousadas)" class="p-3 border rounded-lg" required>
                <input type="text" id="categoryIcon" placeholder="Ícone Font Awesome (ex: fa-bed)" class="p-3 border rounded-lg">
                <input type="text" id="categoryColor" placeholder="Cor Tailwind (ex: emerald)" class="p-3 border rounded-lg">
                <button type="submit" class="md:col-span-2 bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700">Salvar Categoria</button>
            </form>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-md mb-10 border border-blue-100">
            <h3 class="text-xl font-bold mb-4 text-blue-600">Cadastrar / Editar Anúncio</h3>
            <form id="itemForm" class="grid md:grid-cols-2 gap-4">
                <input type="hidden" id="editIndex" value="-1">
                <select id="formCategory" class="p-3 border rounded-lg bg-gray-50" required></select>
                <input type="text" id="formName" placeholder="Nome" class="p-3 border rounded-lg" required>
                <input type="text" id="formPhoto" placeholder="URL da Foto" class="p-3 border rounded-lg">
                <input type="text" id="formContact" placeholder="WhatsApp (ex: 73999999999)" class="p-3 border rounded-lg">
                <input type="text" id="formExtra" placeholder="Preço, Especialidade ou Horário" class="p-3 border rounded-lg">
                <textarea id="formDesc" placeholder="Descrição curta" class="md:col-span-2 p-3 border rounded-lg h-24"></textarea>
                <button type="submit" class="md:col-span-2 bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700">Salvar Anúncio</button>
            </form>
        </div>

        <div class="grid lg:grid-cols-2 gap-8">
            <div class="overflow-x-auto bg-white rounded-xl shadow-md">
                <div class="p-4 border-b font-bold">Categorias cadastradas</div>
                <table class="w-full text-left">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="p-4">Nome</th>
                            <th class="p-4">Slug</th>
                            <th class="p-4">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="adminCategoryBody"></tbody>
                </table>
            </div>

            <div class="overflow-x-auto bg-white rounded-xl shadow-md">
                <div class="p-4 border-b font-bold">Anúncios cadastrados</div>
                <table class="w-full text-left">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="p-4">Nome</th>
                            <th class="p-4">Categoria</th>
                            <th class="p-4">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody"></tbody>
                </table>
            </div>
        </div>
    </section>

    <script>
        const STORAGE_KEY_ITEMS = 'guaratiba_data_v2';
        const STORAGE_KEY_CATS = 'guaratiba_categories_v2';
        const ADMIN_EMAIL = 'h.d.hoficial3658@gmail.com';
        const ADMIN_PASS = '@Ww365888';

        const defaultCategories = [
            { slug: 'casas', name: 'Casas de Temporada', icon: 'fa-home', color: 'blue' },
            { slug: 'restaurantes', name: 'Restaurantes', icon: 'fa-utensils', color: 'orange' },
            { slug: 'farmacias', name: 'Farmácias', icon: 'fa-first-aid', color: 'red' },
            { slug: 'pousadas', name: 'Pousadas', icon: 'fa-bed', color: 'emerald' }
        ];

        const defaultItems = [
            { id: 1, cat: 'casas', name: 'Casa Brisa do Mar', photo: 'https://images.unsplash.com/photo-1499793983690-e29da59ef1c2?auto=format&fit=crop&w=900&q=80', contact: '73988887777', extra: 'R$ 450/dia', desc: 'Frente mar com 3 suítes e piscina privativa.' },
            { id: 2, cat: 'restaurantes', name: 'Cabana do Peixe', photo: 'https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?auto=format&fit=crop&w=900&q=80', contact: '73988885544', extra: 'Frutos do Mar', desc: 'A melhor moqueca da região com vista para o pôr do sol.' },
            { id: 3, cat: 'farmacias', name: 'Farmácia Central', photo: 'https://images.unsplash.com/photo-1586015555751-63bb77f4322a?auto=format&fit=crop&w=900&q=80', contact: '7332981010', extra: '08h às 22h', desc: 'Medicamentos e perfumaria no centro de Guaratiba.' }
        ];

        let categories = loadCategories();
        let items = loadItems();

        function loadCategories() {
            const raw = localStorage.getItem(STORAGE_KEY_CATS);
            if (!raw) return [...defaultCategories];
            try { return JSON.parse(raw); } catch { return [...defaultCategories]; }
        }

        function loadItems() {
            const raw = localStorage.getItem(STORAGE_KEY_ITEMS);
            if (!raw) return [...defaultItems];
            try { return JSON.parse(raw); } catch { return [...defaultItems]; }
        }

        function saveAll() {
            localStorage.setItem(STORAGE_KEY_CATS, JSON.stringify(categories));
            localStorage.setItem(STORAGE_KEY_ITEMS, JSON.stringify(items));
            renderAdmin();
            renderCategorySelect();
        }

        function handleLogin() {
            const email = document.getElementById('admEmail').value.trim().toLowerCase();
            const pass = document.getElementById('admPass').value;

            if (email === ADMIN_EMAIL && pass === ADMIN_PASS) {
                sessionStorage.setItem('isLogged', 'true');
                document.getElementById('adm-login').classList.add('hidden');
                document.getElementById('adm-dashboard').classList.remove('hidden');
                renderAdmin();
                renderCategorySelect();
            } else {
                alert('Acesso negado!');
            }
        }

        function logout() {
            sessionStorage.removeItem('isLogged');
            document.getElementById('adm-dashboard').classList.add('hidden');
            document.getElementById('adm-login').classList.remove('hidden');
        }

        function renderCategorySelect() {
            const select = document.getElementById('formCategory');
            select.innerHTML = categories.map(cat => `<option value="${cat.slug}">${cat.name}</option>`).join('');
        }

        document.getElementById('categoryForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const index = document.getElementById('categoryEditIndex').value;
            const newCategory = {
                slug: document.getElementById('categorySlug').value.trim(),
                name: document.getElementById('categoryName').value.trim(),
                icon: document.getElementById('categoryIcon').value.trim() || 'fa-tags',
                color: document.getElementById('categoryColor').value.trim() || 'blue'
            };

            if (!newCategory.slug || !newCategory.name) {
                alert('Preencha o slug e o nome da categoria.');
                return;
            }

            if (index >= 0) categories[index] = newCategory;
            else categories.push(newCategory);

            saveAll();
            e.target.reset();
            document.getElementById('categoryEditIndex').value = '-1';
            alert('Categoria salva com sucesso!');
        });

        document.getElementById('itemForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const index = Number(document.getElementById('editIndex').value);
            const newItem = {
                id: index >= 0 ? items[index].id : Date.now(),
                cat: document.getElementById('formCategory').value,
                name: document.getElementById('formName').value,
                photo: document.getElementById('formPhoto').value,
                contact: document.getElementById('formContact').value,
                extra: document.getElementById('formExtra').value,
                desc: document.getElementById('formDesc').value
            };

            if (index >= 0) items[index] = newItem;
            else items.push(newItem);

            saveAll();
            e.target.reset();
            document.getElementById('editIndex').value = '-1';
            alert('Anúncio salvo com sucesso!');
        });

        function renderAdmin() {
            const tbodyCat = document.getElementById('adminCategoryBody');
            const tbody = document.getElementById('adminTableBody');

            tbodyCat.innerHTML = categories.map((cat, index) => `
                <tr class="border-b">
                    <td class="p-4 font-medium">${cat.name}</td>
                    <td class="p-4">${cat.slug}</td>
                    <td class="p-4 space-x-2">
                        <button onclick="editCategory(${index})" class="text-blue-600 hover:underline">Editar</button>
                        <button onclick="deleteCategory(${index})" class="text-red-600 hover:underline">Excluir</button>
                    </td>
                </tr>
            `).join('');

            tbody.innerHTML = items.map((item, index) => `
                <tr class="border-b">
                    <td class="p-4 font-medium">${item.name}</td>
                    <td class="p-4 uppercase text-xs">${item.cat}</td>
                    <td class="p-4 space-x-2">
                        <button onclick="editItem(${index})" class="text-blue-600 hover:underline">Editar</button>
                        <button onclick="deleteItem(${index})" class="text-red-600 hover:underline">Excluir</button>
                    </td>
                </tr>
            `).join('');
        }

        function editCategory(index) {
            const cat = categories[index];
            document.getElementById('categorySlug').value = cat.slug;
            document.getElementById('categoryName').value = cat.name;
            document.getElementById('categoryIcon').value = cat.icon || '';
            document.getElementById('categoryColor').value = cat.color || '';
            document.getElementById('categoryEditIndex').value = index;
            window.scrollTo(0, 0);
        }

        function deleteCategory(index) {
            const slug = categories[index].slug;
            if (!confirm('Deseja excluir esta categoria? Isso também afetará os anúncios ligados a ela.')) return;
            categories.splice(index, 1);
            items = items.filter(item => item.cat !== slug);
            saveAll();
        }

        function editItem(index) {
            const item = items[index];
            document.getElementById('formCategory').value = item.cat;
            document.getElementById('formName').value = item.name;
            document.getElementById('formPhoto').value = item.photo;
            document.getElementById('formContact').value = item.contact;
            document.getElementById('formExtra').value = item.extra;
            document.getElementById('formDesc').value = item.desc;
            document.getElementById('editIndex').value = index;
            window.scrollTo(0, 0);
        }

        function deleteItem(index) {
            if (confirm('Deseja excluir este anúncio?')) {
                items.splice(index, 1);
                saveAll();
            }
        }

        window.addEventListener('load', () => {
            if (sessionStorage.getItem('isLogged') === 'true') {
                document.getElementById('adm-login').classList.add('hidden');
                document.getElementById('adm-dashboard').classList.remove('hidden');
                renderAdmin();
                renderCategorySelect();
            }
        });
    </script>
</body>
</html>
